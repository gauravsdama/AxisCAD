name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run release:guard
      - run: npm run kernel:verify
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build

  macos-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - run: npm ci
      - run: npm run kernel:source-check
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm run kernel:rebuild-check
        env:
          AXIS_VCAD_ALLOW_CROSS_HOST_LAYOUT: "1"
          AXIS_VCAD_DIAGNOSTIC_DIR: kernel-rebuild-diagnostics
      - name: Preserve kernel rebuild diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: kernel-rebuild-diagnostics
          path: kernel-rebuild-diagnostics
      - run: python3 native/scripts/inventory-swift-ui-copy.py --source native/Sources --output docs/product/UI_COPY_FULL.md --name 'Axis CAD' --check
      - run: npm run native:test
      - run: npm run conformance:step
      - run: npm run native:package
      - run: codesign --verify --deep --strict native/build/AxisCAD.app
