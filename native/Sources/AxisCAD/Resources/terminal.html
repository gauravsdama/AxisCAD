<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="xterm.css">
<style>html,body,#terminal{height:100%;width:100%;margin:0;background:#080a0c}</style>
</head><body><div id="terminal"></div><script src="xterm.js"></script><script>
  const term = new Terminal({ cursorBlink: true, fontFamily: 'SF Mono, Menlo, monospace', fontSize: 12, theme: { background: '#080a0c', foreground: '#e6edf3', cursor: '#74efb5' } });
  term.open(document.getElementById('terminal'));
  term.onData(data => window.webkit.messageHandlers.axisTerminalInput.postMessage(data));
  window.axisTerminalWrite = data => term.write(data);
  window.axisTerminalClear = () => term.clear();
  window.addEventListener('resize', () => term.focus());
</script></body></html>
