[package]
name = "axis-kernel-wasm"
description = "Axis CAD WASM bindings for the pinned VCAD B-rep kernel"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vcad-kernel = { workspace = true, features = ["no-builtin-font"] }
vcad-kernel-drafting = { workspace = true }
vcad-kernel-sheet = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-ir = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "=0.1.7"

[features]
default = []
ts-rs = []

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O", "--debuginfo"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
