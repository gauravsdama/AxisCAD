[workspace]
resolver = "2"
members = ["crates/tang", "crates/tang-la", "crates/tang-expr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ecto/tang"

[workspace.dependencies]
tang = { version = "0.2.0", path = "crates/tang" }
tang-la = { version = "0.1.0", path = "crates/tang-la" }
tang-expr = { version = "0.1.0", path = "crates/tang-expr" }
